<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>rottenpotato11 | Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="site-header"></div>

    <main class="container">
        <h1>Lab</h1>
        <p>My sandbox for mini-experiments, code snippets, and quick prototypes.</p>

        <hr class="divider">

        <!-- Filter Buttons -->
        <div class="filter-container">
            <button class="filter-btn active" onclick="filterCards('all')">All</button>
            <button class="filter-btn" onclick="filterCards('tag_01')">#tag_01</button>
            <button class="filter-btn" onclick="filterCards('tag_02')">#tag_02</button>
            <button class="filter-btn" onclick="filterCards('tag_03')">#tag_03</button>
            <button class="filter-btn" onclick="filterCards('tag_04')">#tag_04</button>            
        </div>

        <!-- The grid where JavaScript will inject your 20 cards -->
        <div class="project-grid" id="project-grid"></div>
    </main>

    <div id="site-footer"></div>

    <!-- Script to dynamically render cards and handle features -->
    <script>
    // 1. Projects array with multiple tags per card
    const projects = [
        {
            title: "Project 1",
            tags: ["tag_01", "tag_02"],
            year: "2026",
            description: "Description",
            link: "project-minimalist-portfolio.html"
        },
        {
            title: "Project 2",
            tags: ["tag_03", "tag_04"],
            year: "2025",
            description: "Description",
            link: "project-data-pipeline.html"
        },
        {
            title: "Project 3",
            tags: ["tag_01", "tag_02", "tag_04"],
            year: "2025",
            description: "Description",
            link: "project-design-system.html"
        }
    ];

    // 2. Render cards dynamically
    const grid = document.getElementById('project-grid');
    projects.forEach(p => {
        // Generate HTML for each tag badge dynamically
        const tagsHTML = p.tags.map(tag => `<span class="project-tag">${tag}</span>`).join('');

        const cardHTML = `
            <a href="${p.link}" class="project-card-link" data-tags="${p.tags.join(',')}">
                <article class="project-card">
                    <div class="card-header-row">
                        <div class="tag-group">${tagsHTML}</div>
                        <span class="project-year">${p.year}</span>
                    </div>
                    <h3>${p.title}</h3>
                    <p>${p.description}</p>
                    <span class="card-link">See more &rarr;</span>
                </article>
            </a>
        `;
        grid.innerHTML += cardHTML;
    });

    // 3. Load Header & Footer components
    fetch('header.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('site-header').innerHTML = data;
            let currentPath = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('nav a').forEach(link => {
                if (link.getAttribute('href') === currentPath) link.classList.add('active');
            });
        });

    fetch('footer.html')
        .then(res => res.text())
        .then(data => document.getElementById('site-footer').innerHTML = data);

    // 4. Updated Filter function for multiple tags
    function filterCards(category) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        document.querySelectorAll('.project-card-link').forEach(card => {
            // Get array of tags stored in data-tags attribute
            const cardTags = card.getAttribute('data-tags').split(',');
            
            // Show card if 'all' is selected or if it includes the clicked tag
            if (category === 'all' || cardTags.includes(category)) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }
    </script>
</body>
</html>
