<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>rottenpotato11 | Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Header -->
    <div id="site-header"></div>

    <main class="container">
        <h1>Archive</h1>
        <p>A collection of cool things I've seen over the internet ໒(⊙ᴗ⊙)७✎▤</p>
    </main>

    <!-- Footer -->
    <div id="site-footer"></div>

    <!-- Script to Load Components & Handle Nav Highlighting -->
    <script>
        fetch('header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('site-header').innerHTML = data;
                
                // Automatically find current page and add 'active' class
                let currentPath = window.location.pathname.split('/').pop();
                if (currentPath === '' || currentPath === '/') {
                    currentPath = 'index.html';
                }
                
                document.querySelectorAll('nav a').forEach(link => {
                    if (link.getAttribute('href') === currentPath) {
                        link.classList.add('active');
                    } else {
                        link.classList.remove('active');
                    }
                });
            });

        fetch('footer.html')
            .then(res => res.text())
            .then(data => document.getElementById('site-footer').innerHTML = data);
    </script>
</body>
</html>
